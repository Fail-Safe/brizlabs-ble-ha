set_properties:
  name: Set device properties
  description: Send native BrizLabs properties to the light over local Bluetooth.
  fields:
    address:
      required: true
      selector:
        text:
    properties:
      required: true
      selector:
        object:
paint_segments:
  name: Paint segments
  description: Set a color on selected zero-based segments of a micro string light.
  fields:
    address:
      required: true
      selector:
        text:
    segments:
      required: true
      selector:
        object:
    hue:
      required: true
      selector:
        number:
          min: 0
          max: 360
    saturation:
      required: true
      selector:
        number:
          min: 0
          max: 100
    value:
      selector:
        number:
          min: 0
          max: 100
    segment_count:
      selector:
        number:
          min: 1
          max: 127
set_scene:
  name: Set scene
  description: Start a scene effect with an ordered list of colors (captured payload format; 1-7 colors).
  fields:
    address:
      required: true
      selector:
        text:
    effect:
      required: true
      description: Scene effect name (e.g. Rainbow, Flow, Fall).
      selector:
        text:
    colors:
      required: true
      description: "Ordered list of {hue: 0-360, saturation: 0-100, value: 0-100}."
      selector:
        object:
    speed:
      selector:
        number:
          min: 0
          max: 100
    brightness:
      selector:
        number:
          min: 1
          max: 100
    direction:
      description: Scene direction. Omit for Right (the default header).
      selector:
        select:
          options:
            - Left
            - Right
