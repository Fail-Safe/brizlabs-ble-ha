name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (versions the tests were run against)
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2026.8.2 pytest==9.1.1 pytest-asyncio==1.4.0 bleak==3.0.2 bleak-retry-connector==4.7.1
      - name: Run tests
        run: python -m pytest tests -q -W error::RuntimeWarning
